<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonator Calculator</title>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --panel-bg: #ffffff;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border: #e4e4e7;
            --accent: #3239f1; 
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #d8756f; 
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--panel-bg);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
        }

        .output-panel {
            background: var(--bg-color);
            padding: 1.5rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        #status-indicator {
            padding: 1rem;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Resonator Calculator</h1>
    
    <div class="grid">
        <div class="controls">
            <div class="control-group">
                <div class="control-header">
                    <label>Structural Wall Thickness (mm)</label>
                    <span id="val-wall">230</span>
                </div>
                <input type="range" id="slider-wall" min="100" max="600" value="230" step="5">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label>Target Frequency (Hz)</label>
                    <span id="val-freq">35</span>
                </div>
                <input type="range" id="slider-freq" min="20" max="120" value="35" step="1">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label>Target Wind Speed (km/h)</label>
                    <span id="val-wind">74</span>
                </div>
                <input type="range" id="slider-wind" min="20" max="160" value="74" step="1">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label>Fabricated Belly Depth (mm)</label>
                    <span id="val-depth">640</span>
                </div>
                <input type="range" id="slider-depth" min="50" max="2000" value="640" step="10">
            </div>
        </div>

        <div class="output-panel">
            <div class="metric">
                <span class="metric-label">Required Neck Diameter</span>
                <span class="metric-value"><span id="out-neck">0.0</span> mm</span>
            </div>
            
            <div class="metric">
                <span class="metric-label">Required Belly Diameter</span>
                <span class="metric-value"><span id="out-belly-dia">0.0</span> mm</span>
            </div>

            <div class="metric">
                <span class="metric-label">Total Captive Volume</span>
                <span class="metric-value" style="font-size: 1.2rem; color: var(--text-main);"><span id="out-vol">0.0</span> Liters</span>
            </div>

            <div id="status-indicator">INITIALIZING</div>
        </div>
    </div>
</div>

<script>
    const speedOfSound = 343; // m/s
    const strouhalConstant = 0.21; 

    const elements = {
        wall: document.getElementById('slider-wall'),
        freq: document.getElementById('slider-freq'),
        wind: document.getElementById('slider-wind'),
        depth: document.getElementById('slider-depth')
    };

    const displays = {
        wall: document.getElementById('val-wall'),
        freq: document.getElementById('val-freq'),
        wind: document.getElementById('val-wind'),
        depth: document.getElementById('val-depth'),
        neckOut: document.getElementById('out-neck'),
        bellyDiaOut: document.getElementById('out-belly-dia'),
        volOut: document.getElementById('out-vol'),
        status: document.getElementById('status-indicator')
    };

    function calculate() {
        // Update UI labels
        Object.keys(elements).forEach(key => {
            displays[key].innerText = elements[key].value;
        });

        // 1. Gather Inputs
        const wallMm = parseFloat(elements.wall.value);
        const targetFreq = parseFloat(elements.freq.value);
        const windKmh = parseFloat(elements.wind.value);
        const depthMm = parseFloat(elements.depth.value);

        // Convert constraints to standard units (meters, m/s)
        const wallM = wallMm / 1000;
        const windMs = windKmh / 3.6;
        const depthM = depthMm / 1000;

        // 2. STROUHAL EQUATION (Calculate Neck Diameter)
        const neckDiaM = (strouhalConstant * windMs) / targetFreq;
        const neckDiaMm = neckDiaM * 1000;
        const neckRadiusM = neckDiaM / 2;

        // 3. HELMHOLTZ EQUATION (Calculate Required Volume)
        const neckArea = Math.PI * Math.pow(neckRadiusM, 2);
        const effectiveNeckLength = wallM + (1.5 * neckRadiusM); // End correction
        
        const frequencyTerm = Math.pow((2 * Math.PI * targetFreq) / speedOfSound, 2);
        const requiredVolumeM3 = neckArea / (effectiveNeckLength * frequencyTerm);
        const requiredVolumeLiters = requiredVolumeM3 * 1000;

        // 4. CYLINDER GEOMETRY (Calculate Required Belly Diameter)
        const requiredBellyAreaM2 = requiredVolumeM3 / depthM;
        const requiredBellyRadiusM = Math.sqrt(requiredBellyAreaM2 / Math.PI);
        const requiredBellyDiaMm = (requiredBellyRadiusM * 2) * 1000;

        // Output results to UI
        displays.neckOut.innerText = neckDiaMm.toFixed(1);
        displays.bellyDiaOut.innerText = requiredBellyDiaMm.toFixed(1);
        displays.volOut.innerText = requiredVolumeLiters.toFixed(1);

        // 5. Diagnostics & Structural Logic Flags
        let stateText = "";
        let color = "";
        let bg = "";

        if (neckDiaMm >= requiredBellyDiaMm) {
            stateText = "ERROR: NECK WIDER THAN BELLY";
            color = "var(--red)";
            bg = "#fcebe9"; 
            displays.status.style.borderColor = "var(--red)";
        } else if (requiredBellyDiaMm > 2000) {
            stateText = "WARNING: BELLY DIA EXCEEDS 2 METERS";
            color = "var(--yellow)";
            bg = "#fef3c7"; 
            displays.status.style.borderColor = "var(--yellow)";
        } else {
            stateText = "FABRICATION GEOMETRY VALID";
            color = "var(--green)";
            bg = "#d1fae5"; 
            displays.status.style.borderColor = "var(--green)";
        }

        displays.status.innerText = stateText;
        displays.status.style.color = color;
        displays.status.style.backgroundColor = bg;
    }

    Object.values(elements).forEach(el => {
        el.addEventListener('input', calculate);
    });

    // Initialize on load
    calculate();
</script>
</body>
</html>
